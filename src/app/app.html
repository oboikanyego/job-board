<div class="main-container">
  <div class="navigation" *ngIf="commonService.IsUserSignedIn">
    <mat-toolbar class="navbar">
      <span class="logo">Job listing</span>

      <span class="spacer"></span>

      <nav class="nav-links">
        <a mat-button routerLink="/applications" routerLinkActive="active-link"
          >Applications</a
        >
        <a mat-button routerLink="/jobs" routerLinkActive="active-link"
          >Jobs</a
        >
        <a mat-button routerLink="/results" routerLinkActive="active-link"
          >Profile</a
        >
        <a mat-button routerLink="/reviews" routerLinkActive="active-link"
          >Subscription</a
        >
      </nav>

      <span class="spacer"></span>

      <div class="auth-buttons">
        <button mat-button color="secondary" class="login-btn">
            Create Post
        </button>
        <button mat-raised-button color="primary" class="signup-btn">
          Logout
        </button>
      </div>
    </mat-toolbar>
  </div>
  <div class="body">
    <router-outlet />
  </div>
</div>
