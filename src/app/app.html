<div class="main-container">
  <div class="navigation" *ngIf="commonService.IsUserSignedIn">
    <mat-toolbar class="navbar">
      <span class="logo">Job listing</span>

      <span class="spacer"></span>

      <nav class="nav-links">
        <ng-container *ngFor="let item of navItems">
  <a
     mat-button 
     [routerLink]="item.path" 
     routerLinkActive="active-link">
    {{ item.label }}
  </a>
</ng-container>

      </nav>

      <span class="spacer"></span>

      <div class="auth-buttons">
        <button mat-button color="secondary" class="login-btn">
          Create Post
        </button>
        <button mat-raised-button color="primary" class="signup-btn">
          Logout
        </button>
      </div>
    </mat-toolbar>
  </div>
  <div class="body">
    <app-loader></app-loader>
    <router-outlet />
  </div>
</div>
